name: Make code archive
description: Archive Shamrock with submodules and upload as an artifact

branding:
  icon: archive
  color: green

inputs:
  output_name:
    description: Output archive filename and artifact name
    required: true

runs:
  using: composite
  steps:
    - name: Validate output name
      shell: bash
      run: |
        if [[ "${{ inputs.output_name }}" != *.tar.gz ]]; then
          echo "output_name must end with .tar.gz, got: ${{ inputs.output_name }}"
          exit 1
        fi

    - uses: actions/checkout@v7

    - name: Checkout submodules
      shell: bash
      run: git submodule update --init --recursive

    - name: Download git-archive-all.sh
      shell: bash
      run: |
        wget https://raw.githubusercontent.com/fabacab/git-archive-all.sh/refs/heads/master/git-archive-all.sh
        chmod +x git-archive-all.sh

    - name: Archive repository with submodules
      shell: bash
      run: ./git-archive-all.sh --format tar.gz --prefix archive

    - name: Rename archive
      shell: bash
      run: |
        archive="archive.tar.gz"
        if [[ ! -f "$archive" ]]; then
          echo "Expected archive not found: $archive"
          echo "Contents of current directory:"
          ls -la .
          exit 1
        fi
        mv "$archive" ${{ inputs.output_name }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.output_name }}
        path: ${{ inputs.output_name }}
        archive: false
